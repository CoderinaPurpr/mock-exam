<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Examiner</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .admin-header {
      margin-bottom: 28px;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    .admin-table th,
    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .admin-table th {
      font-weight: 600;
    }

    .admin-table a {
      font-weight: 600;
    }

    .muted {
      color: #666;
    }

    .error {
      color: #a00;
    }

    .score-cell {
      white-space: nowrap;
      line-height: 1.4;
    }

    .score-cell span {
      display: block;
    }

    .admin-table th:nth-child(4),
    .admin-table th:nth-child(5),
    .admin-table th:nth-child(6) {
      min-width: 120px;
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>IELTS Examiner</h1>
    <p class="muted">Candidate submissions</p>
  </header>

  <main>
    <div id="status">Loading submissions...</div>

    <table class="admin-table" id="submissionsTable" hidden>
      <thead>
        <tr>
          <th>Candidate</th>
          <th>Email</th>
          <th>Date</th>
          <th>Reading</th>
          <th>Listening</th>
          <th>Writing AI</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="submissionsBody"></tbody>
    </table>
  </main>

  <script>
    async function loadSubmissions() {
      const status = document.getElementById("status");
      const table = document.getElementById("submissionsTable");
      const body = document.getElementById("submissionsBody");

      try {
        const response = await fetch("/api/submissions", {
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Unable to load submissions");
        }

        const submissions = data.submissions || [];

        if (!submissions.length) {
          status.textContent = "No submissions found.";
          return;
        }

        body.innerHTML = "";

        for (const submission of submissions) {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${escapeHtml(submission.name || "")}</td>
            <td>${escapeHtml(submission.email || "")}</td>
            <td>${formatDate(submission.created_at)}</td>
            <td class="score-cell">${formatScoreWithBand(
              submission.reading_score,
              submission.reading_total,
              academicReadingBand
            )}</td>

            <td class="score-cell">${formatScoreWithBand(
              submission.listening_score,
              submission.listening_total,
              listeningBand
            )}</td>

            <td class="score-cell">${formatWritingAi(
              submission.writing_task1_ai_band,
              submission.writing_task2_ai_band
            )}</td>
            <td>${escapeHtml(submission.status || "")}</td>
            <td>
              <a href="/admin/view.html?id=${encodeURIComponent(submission.id)}">
                View
              </a>
            </td>
          `;

          body.appendChild(row);
        }

        status.hidden = true;
        table.hidden = false;
      } catch (err) {
        status.className = "error";
        status.textContent = `Could not load submissions: ${err.message}`;
      }
    }

  function formatScoreWithBand(score, total, bandFunction) {
    if (score === null || score === undefined) return "N/A";

    const band = bandFunction(score);
    const scoreText = `${score} / ${total ?? 40}`;

    return band === null
      ? scoreText
      : `<span>${scoreText}</span><span>Band ${band.toFixed(1)}</span>`;
  }

  function formatWritingAi(task1Band, task2Band) {
    if (
      (task1Band === null || task1Band === undefined) &&
      (task2Band === null || task2Band === undefined)
    ) {
      return "N/A";
    }

    const task1 =
      task1Band === null || task1Band === undefined
        ? "N/A"
        : Number(task1Band).toFixed(1);

    const task2 =
      task2Band === null || task2Band === undefined
        ? "N/A"
        : Number(task2Band).toFixed(1);

    return `<span>T1 ${task1}</span><span>T2 ${task2}</span>`;
  }

  function academicReadingBand(score) {
    if (score >= 39) return 9;
    if (score >= 37) return 8.5;
    if (score >= 35) return 8;
    if (score >= 33) return 7.5;
    if (score >= 30) return 7;
    if (score >= 27) return 6.5;
    if (score >= 23) return 6;
    if (score >= 19) return 5.5;
    if (score >= 15) return 5;
    if (score >= 13) return 4.5;
    if (score >= 10) return 4;
    if (score >= 8) return 3.5;
    if (score >= 6) return 3;
    if (score >= 4) return 2.5;

    return null;
  }

  function listeningBand(score) {
    if (score >= 39) return 9;
    if (score >= 37) return 8.5;
    if (score >= 35) return 8;
    if (score >= 32) return 7.5;
    if (score >= 30) return 7;
    if (score >= 26) return 6.5;
    if (score >= 23) return 6;
    if (score >= 18) return 5.5;
    if (score >= 16) return 5;
    if (score >= 13) return 4.5;
    if (score >= 11) return 4;

    return null;
  }

    function formatDate(value) {
      if (!value) return "N/A";
      return value;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadSubmissions();
  </script>

</body>
</html>
