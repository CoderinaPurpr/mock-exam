<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free IELTS Mock Exam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>Free IELTS Mock Exam</h1>

    <p class="lead">
      Take a full IELTS-style mock test covering <strong>Reading, Listening, Writing, and Speaking</strong>.
    </p>

    <p class="muted">
      Your answers will be reviewed by an examiner.
      <strong>Results are not shown on-screen</strong> — we’ll contact you directly with feedback.
    </p>

    <div class="card">
      <h2>Enter your details to receive your results</h2>

      <label>
        Full Name <span class="required">*</span><br />
        <input id="leadName" type="text" placeholder="Your name" />
      </label>

      <br /><br />

      <label>
        Email Address <span class="required">*</span><br />
        <input id="leadEmail" type="email" placeholder="you@example.com" />
      </label>

      <br /><br />

      <label>
        WhatsApp (optional)<br />
        <input id="leadWhatsApp" type="text" placeholder="+27…" />
      </label>

      <br /><br />

      <label class="checkbox">
        <input id="leadConsent" type="checkbox" />
        I consent to be contacted with my IELTS mock test results.
      </label>

      <p class="error" id="formError" style="min-height:1.2em;"></p>

      <button id="startBtn" class="btn" type="button">Start Mock Exam</button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("startBtn").addEventListener("click", () => {
        const name = leadName.value.trim();
        const email = leadEmail.value.trim();
        const whatsapp = leadWhatsApp.value.trim();
        const consent = leadConsent.checked;
        const errorBox = formError;

        errorBox.textContent = "";

        if (!name || !email) {
          errorBox.textContent = "Please enter your name and email.";
          return;
        }
        if (!consent) {
          errorBox.textContent = "Please give consent so we can contact you.";
          return;
        }

        localStorage.setItem(
          "mock_lead",
          JSON.stringify({ name, email, whatsapp, consent })
        );

        // NEW attempt every time
        localStorage.setItem("mock_submission_id", "sub_" + crypto.randomUUID());

        // Clear old section data
        localStorage.removeItem("mock_reading_answers");
        localStorage.removeItem("reading_start_ts_IELTS11_R1_P1");

        // GO FORWARD
        window.location.assign("/reading.html");
      });
    });
  </script>

</body>
</html>
