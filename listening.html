<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IELTS Mock Exam — Listening</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ============================================================
       PAGE HELPERS (safe, won’t fight your style.css)
       ============================================================ */
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .spacer { height: 12px; }
    .hidden { display:none !important; }
    .notice { padding:10px 12px; border-radius:10px; background: rgba(0,0,0,.04); }
    .timerBar { font-weight:700; }
    .danger { color:#b00020; }
    .q { margin: 10px 0; }
    .q input[type="text"], .q input[type="email"] { max-width: 340px; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px){ .grid2 { grid-template-columns: 1fr; } }
    .opt { margin: 6px 0; }
    .btn.secondary { opacity:.9; }
    .small { font-size: .9em; opacity: .85; }
    .progressWrap { width: 100%; max-width: 520px; }
    .progress { width: 100%; }

    /* ============================================================
       SECTION 1 — CRIME REPORT FORM (matches screenshot order)
       ============================================================ */
    .crime-form{border:1px solid #ccc;border-radius:8px;overflow:hidden;margin-top:12px}
    .crime-form__title{padding:12px 14px;text-align:center;font-weight:700;border-bottom:1px solid #ccc}
    .crime-form__section{padding:10px 14px;font-weight:700;background:#f7f7f7;border-top:1px solid #ccc;border-bottom:1px solid #ccc}
    .crime-form__row{display:grid;grid-template-columns:240px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid #eee}
    .crime-form__label{color:#222}
    .crime-form__value{color:#111}
    .crime-form__example{background:#fcfcfc}
    .crime-form__underline{border-bottom:1px dotted #111;padding:0 6px}
    .crime-form__input{max-width:220px;padding:6px 8px}
    @media (max-width: 720px){ .crime-form__row{grid-template-columns:1fr} }

/* ============================================================
   SECTION 4 — NOTES LAYOUT (matches screenshot)
   ============================================================ */
.notes-box{
  border:1px solid #ccc;
  border-radius:8px;
  padding:14px 14px 10px;
  margin-top:12px;
  background:#fff;
  max-width: 820px;
}

.notes-instruction{
  font-style: italic;
  margin: 0 0 10px 0;
  opacity: .9;
}

.notes-title{
  font-weight: 800;
  text-align: center;
  font-size: 1.15rem;
  padding: 8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  margin: 0 0 12px 0;
}

.notes-section{
  margin: 10px 0 0 0;
}

.notes-section h4{
  margin: 10px 0 6px 0;
  font-size: 1rem;
  font-weight: 800;
}

.notes-line{
  margin: 4px 0;
  line-height: 1.35;
}

.notes-bullets{
  margin: 6px 0 6px 22px;
  padding: 0;
}

.notes-bullets li{
  margin: 4px 0;
}

.notes-q{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.notes-qnum{
  font-weight: 800;
}

.notes-blank{
  width: 240px;
  max-width: 60vw;
  border: none;
  border-bottom: 2px dotted #111;
  background: transparent;
  padding: 2px 4px;
  outline: none;
}

.notes-blank:disabled{
  opacity: .7;
}

@media (max-width: 520px){
  .notes-blank{ width: 180px; }
}


  </style>
</head>
<body>

  <main class="container">
    <h1>Listening</h1>

    <p class="muted">
      You can play each section audio <strong>only once</strong>.
      When the test ends, you will get <strong>2 minutes</strong> to check and change your answers.
    </p>

    <div id="topMsg" class="error" style="min-height:1.2em;"></div>

    <!-- ============================================================
         SECTION NAV / STATUS
         ============================================================ -->
    <div class="card">
      <div class="row">
        <div><strong>Test:</strong> IELTS Listening — Test 1</div>
        <div class="spacer"></div>
        <div id="sectionStatus" class="notice">Loading…</div>
      </div>

      <div class="spacer"></div>

      <div class="row">
        <button id="playBtn" class="btn" type="button">Play Section Audio</button>
        <button id="resumeBtn" class="btn secondary hidden" type="button">Resume</button>

        <div class="timerBar">
          Review time: <span id="reviewTime">--:--</span>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="progressWrap">
        <input id="audioProgress" class="progress" type="range" min="0" max="100" value="0" disabled />
        <div class="small" id="audioProgressText">00:00 / 00:00</div>
      </div>

      <!-- Embedded audio element (no controls; play via button) -->
      <audio id="audio" preload="none"></audio>

      <div class="spacer"></div>

      <div class="row">
        <button id="nextBtn" class="btn secondary" type="button" disabled>Next Section</button>
      <!--  <span class="small">Next unlocks when the 2-minute review ends.</span> -->
      </div>
    </div>

    <!-- ============================================================
         QUESTIONS
         ============================================================ -->
    <div class="card" id="questionsCard">
      <h2 id="sectionTitle">Section</h2>
      <div id="questions"></div>
      <p id="qMsg" class="error" style="min-height:1.2em;"></p>
    </div>
  </main>

  <script>
    // ============================================================
    // Guard: must start from landing page (index.html)
    // ============================================================
    (function guard() {
      let lead = null;
      try { lead = JSON.parse(localStorage.getItem("mock_lead") || "null"); } catch {}
      const submissionId = localStorage.getItem("mock_submission_id");
      if (!lead || !lead.name || !lead.email || !submissionId) {
        window.location.assign("/index.html");
      }
    })();

    // ============================================================
    // Config
    // ============================================================
    const TEST_ID = "IELTS_LISTENING_T1";
    const REVIEW_SECONDS = 2 * 60;

    const SECTIONS = [
      { idx: 1, title: "SECTION 1 (Questions 1–10)",  audioSrc: "/assets/listening/section1.mp3", qFrom: 1,  qTo: 10 },
      { idx: 2, title: "SECTION 2 (Questions 11–20)", audioSrc: "/assets/listening/section2.mp3", qFrom: 11, qTo: 20 },
      { idx: 3, title: "SECTION 3 (Questions 21–30)", audioSrc: "/assets/listening/section3.mp3", qFrom: 21, qTo: 30 },
      { idx: 4, title: "SECTION 4 (Questions 31–40)", audioSrc: "/assets/listening/section4.mp3", qFrom: 31, qTo: 40 },
    ];

    // Storage keys (scoped per submission so shared laptops don't collide)
    const submissionId = localStorage.getItem("mock_submission_id");
    const lead = JSON.parse(localStorage.getItem("mock_lead") || "null");

    const KEY = {
      STATE: `listening_state_${submissionId}`,          // { currentSection, reviewEndTsBySection, sectionAudio, lockedSections }
      ANSWERS: `mock_listening_answers_${submissionId}`, // { test_id, sections:{1:{answers...},...}, completed }
    };

    // ============================================================
    // DOM
    // ============================================================
    const topMsg = document.getElementById("topMsg");
    const sectionStatus = document.getElementById("sectionStatus");
    const sectionTitle = document.getElementById("sectionTitle");
    const questionsEl = document.getElementById("questions");
    const qMsg = document.getElementById("qMsg");

    const playBtn = document.getElementById("playBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const nextBtn = document.getElementById("nextBtn");

    const reviewTimeEl = document.getElementById("reviewTime");

    const audio = document.getElementById("audio");
    const audioProgress = document.getElementById("audioProgress");
    const audioProgressText = document.getElementById("audioProgressText");

    // ============================================================
    // State helpers
    // ============================================================
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(KEY.STATE) || "null"); } catch {}
      if (!s || typeof s !== "object") {
        s = {
          currentSection: 1,
          sectionAudio: {},
          reviewEndTsBySection: {},
          lockedSections: {}
        };
        saveState(s);
      }
      return s;
    }

    function saveState(s) {
      localStorage.setItem(KEY.STATE, JSON.stringify(s));
    }

    function loadAnswers() {
      let a = null;
      try { a = JSON.parse(localStorage.getItem(KEY.ANSWERS) || "null"); } catch {}
      if (!a || typeof a !== "object") {
        a = { test_id: TEST_ID, sections: {}, completed: false };
        localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
      }
      return a;
    }

    function saveAnswers(a) {
      localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
    }

    function nowMs() { return Date.now(); }

    // ============================================================
    // Question rendering (ONLY change: SECTION 1 layout + order)
    // ============================================================
    function renderSectionQuestions(sectionIdx) {
      questionsEl.innerHTML = "";
      qMsg.textContent = "";

      // =========================
      // SECTION 1 (Questions 1–10) — MATCH SCREENSHOT ORDER
      // =========================
      if (sectionIdx === 1) {
        sectionTitle.textContent = "SECTION 1 — Questions 1–10";
        questionsEl.innerHTML = `
          <p><strong>SECTION 1 Questions 1–10</strong><br>
            Complete the form below.<br>
            Write <strong>ONE WORD AND/OR A NUMBER</strong> for each answer.
          </p>

          <div class="crime-form">
            <div class="crime-form__title">CRIME REPORT FORM</div>

            <div class="crime-form__row">
              <div class="crime-form__label"><strong>Type of crime:</strong></div>
              <div class="crime-form__value">theft</div>
            </div>

            <div class="crime-form__section">Personal information</div>

            <!-- Example (visible, not an input) -->
            <div class="crime-form__row crime-form__example">
              <div class="crime-form__label">Example</div>
              <div class="crime-form__value"></div>
            </div>
            <div class="crime-form__row crime-form__example">
              <div class="crime-form__label">Name</div>
              <div class="crime-form__value">Louise <span class="crime-form__underline">Taylor</span></div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Nationality</div>
              <div class="crime-form__value">
                <strong>1</strong>&nbsp;
                <input id="q1" type="text" class="crime-form__input" />
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Date of birth</div>
              <div class="crime-form__value">14 December 1977</div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Occupation</div>
              <div class="crime-form__value">interior designer</div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Reason for visit</div>
              <div class="crime-form__value">
                business (to buy antique <strong>2</strong>&nbsp;
                <input id="q2" type="text" class="crime-form__input" />
                )
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Length of stay</div>
              <div class="crime-form__value">two months</div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Current address</div>
              <div class="crime-form__value">
                <strong>3</strong>&nbsp;
                <input id="q3" type="text" class="crime-form__input" />
                &nbsp;Apartments (No 15)
              </div>
            </div>

            <div class="crime-form__section">Details of theft</div>

            <div class="crime-form__row">
              <div class="crime-form__label">Items stolen</div>
              <div class="crime-form__value">
                a wallet containing approximately <strong>4</strong>&nbsp;£&nbsp;
                <input id="q4" type="text" class="crime-form__input" />
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label"></div>
              <div class="crime-form__value">
                a <strong>5</strong>&nbsp;
                <input id="q5" type="text" class="crime-form__input" />
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label">Date of theft</div>
              <div class="crime-form__value">
                <strong>6</strong>&nbsp;
                <input id="q6" type="text" class="crime-form__input" />
              </div>
            </div>

            <div class="crime-form__section">Possible time and place of theft</div>

            <div class="crime-form__row">
              <div class="crime-form__label">Location</div>
              <div class="crime-form__value">
                outside the <strong>7</strong>&nbsp;
                <input id="q7" type="text" class="crime-form__input" />
                &nbsp;at about 4 pm
              </div>
            </div>

            <div class="crime-form__section">Details of suspect</div>

            <div class="crime-form__row">
              <div class="crime-form__label"></div>
              <div class="crime-form__value">
                some boys asked for the <strong>8</strong>&nbsp;
                <input id="q8" type="text" class="crime-form__input" />
                &nbsp;then ran off
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label"></div>
              <div class="crime-form__value">
                one had a T-shirt with a picture of a tiger
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label"></div>
              <div class="crime-form__value">
                he was about 12, slim build with <strong>9</strong>. hair
                <input id="q9" type="text" class="crime-form__input" />
              </div>
            </div>

            <div class="crime-form__row">
              <div class="crime-form__label"><strong>Crime reference number allocated</strong></div>
              <div class="crime-form__value">
                <strong>10</strong>&nbsp;
                <input id="q10" type="text" class="crime-form__input" />
              </div>
            </div>
          </div>
        `;
      }

      // =========================
      // SECTION 2 (unchanged)
      // =========================
      if (sectionIdx === 2) {
        sectionTitle.textContent = "SECTION 2 — Questions 11–20";
        questionsEl.innerHTML = `
          <p><strong>Induction talk for new apprentices</strong></p>

          <div class="notice">
            <strong>Questions 11–12</strong><br>
            Choose <strong>TWO</strong> letters, A–E.
          </div>

          <div class="q">
            <p>Which TWO pieces of advice for the first week of an apprenticeship does the manager give?</p>
            <label class="opt"><input type="checkbox" name="q11_12_pick" value="A"> A get to know colleagues</label><br>
            <label class="opt"><input type="checkbox" name="q11_12_pick" value="B"> B learn from any mistakes</label><br>
            <label class="opt"><input type="checkbox" name="q11_12_pick" value="C"> C ask lots of questions</label><br>
            <label class="opt"><input type="checkbox" name="q11_12_pick" value="D"> D react positively to feedback</label><br>
            <label class="opt"><input type="checkbox" name="q11_12_pick" value="E"> E enjoy new challenges</label>
            <div class="spacer"></div>
            <div class="row">
              <label><strong>11</strong> <input type="text" id="q11" placeholder="A–E" readonly></label>
              <label><strong>12</strong> <input type="text" id="q12" placeholder="A–E" readonly></label>
            </div>
            <p class="small">Pick exactly 2 options above (auto-fills 11 and 12).</p>
          </div>

          <hr>

          <div class="notice">
            <strong>Questions 13–14</strong><br>
            Choose <strong>TWO</strong> letters, A–E.
          </div>

          <div class="q">
            <p>Which TWO things does the manager say mentors can help with?</p>
            <label class="opt"><input type="checkbox" name="q13_14_pick" value="A"> A confidence-building</label><br>
            <label class="opt"><input type="checkbox" name="q13_14_pick" value="B"> B making career plans</label><br>
            <label class="opt"><input type="checkbox" name="q13_14_pick" value="C"> C completing difficult tasks</label><br>
            <label class="opt"><input type="checkbox" name="q13_14_pick" value="D"> D making a weekly timetable</label><br>
            <label class="opt"><input type="checkbox" name="q13_14_pick" value="E"> E reviewing progress</label>
            <div class="spacer"></div>
            <div class="row">
              <label><strong>13</strong> <input type="text" id="q13" placeholder="A–E" readonly></label>
              <label><strong>14</strong> <input type="text" id="q14" placeholder="A–E" readonly></label>
            </div>
            <p class="small">Pick exactly 2 options above (auto-fills 13 and 14).</p>
          </div>

          <hr>

          <div class="notice">
            <strong>Questions 15–20</strong><br>
            Write the correct letter, A, B or C.
          </div>

          <p><strong>A</strong> It is encouraged.<br>
             <strong>B</strong> There are some restrictions.<br>
             <strong>C</strong> It is against the rules.</p>

          ${renderABC(15, "Using the internet")}
          ${renderABC(16, "Flexible working")}
          ${renderABC(17, "Booking holidays")}
          ${renderABC(18, "Working overtime")}
          ${renderABC(19, "Wearing trainers")}
          ${renderABC(20, "Bringing food to work")}
        `;

        bindTwoPick("q11_12_pick", "q11", "q12");
        bindTwoPick("q13_14_pick", "q13", "q14");
        bindABCRadios([15,16,17,18,19,20]);
      }

      // =========================
      // SECTION 3 (unchanged)
      // =========================
      if (sectionIdx === 3) {
        sectionTitle.textContent = "SECTION 3 — Questions 21–30";
        questionsEl.innerHTML = `
          <p><strong>Cities built by the sea</strong></p>

          <div class="notice">
            <strong>Questions 21–25</strong><br>
            Choose the correct letter, A, B or C.
          </div>

          ${renderMCQ(21, "Carla and Rob were surprised to learn that coastal cities…", [
            ["A", "contain nearly half the world's population."],
            ["B", "include most of the world's largest cities."],
            ["C", "are growing twice as fast as other cities."]
          ])}

          ${renderMCQ(22, "According to Rob, building coastal cities near rivers…", [
            ["A", "may bring pollution to the cities."],
            ["B", "may reduce the land available for agriculture."],
            ["C", "may mean the countryside is spoiled by industry."]
          ])}

          ${renderMCQ(23, "What mistake was made when building water drainage channels in Miami in the 1950s?", [
            ["A", "There were not enough of them."],
            ["B", "They were made of unsuitable materials."],
            ["C", "They did not allow for the effects of climate change."]
          ])}

          ${renderMCQ(24, "What do Rob and Carla think the authorities in Miami should do immediately?", [
            ["A", "take measures to restore ecosystems"],
            ["B", "pay for a new flood prevention system"],
            ["C", "stop disposing of waste materials into the ocean"]
          ])}

          ${renderMCQ(25, "What do they agree should be the priority for international action?", [
            ["A", "greater coordination of activities"],
            ["B", "more sharing of information"],
            ["C", "agreement on shared policies"]
          ])}

          <hr>

          <div class="notice">
            <strong>Questions 26–30</strong><br>
            Choose <strong>FIVE</strong> answers from the box and write the correct letter, A–G.
          </div>

          <div class="notice">
            <strong>Decisions</strong><br>
            A use visuals<br>
            B keep it short<br>
            C involve other students<br>
            D check the information is accurate<br>
            E provide a handout<br>
            F focus on one example<br>
            G do online research
          </div>

          ${renderAG(26, "Historical background")}
          ${renderAG(27, "Geographical factors")}
          ${renderAG(28, "Past mistakes")}
          ${renderAG(29, "Future risks")}
          ${renderAG(30, "International implications")}
        `;

        bindMCQRadios([21,22,23,24,25]);
      }

// =========================
// SECTION 4 — MATCH SCREENSHOT NOTES LAYOUT
// =========================
if (sectionIdx === 4) {
  sectionTitle.textContent = "SECTION 4 — Questions 31–40";

  questionsEl.innerHTML = `
    <div class="notes-box">
      <p class="notes-instruction">Write <strong>ONE WORD ONLY</strong> for each answer.</p>

      <div class="notes-title">Marine renewable energy (ocean energy)</div>

      <div class="notes-section">
        <h4>Introduction</h4>

        <div class="notes-line">
          More energy required because of growth in population and
          <span class="notes-q">
            <span class="notes-qnum">31</span>
            <input id="q31" class="notes-blank" type="text" />
          </span>
        </div>

        <div class="notes-line"><strong>What’s needed:</strong></div>
        <ul class="notes-bullets">
          <li>renewable energy sources</li>
          <li>methods that won’t create pollution</li>
        </ul>
      </div>

      <div class="notes-section">
        <h4>Wave energy</h4>

        <div class="notes-line">
          Advantage: waves provide a
          <span class="notes-q">
            <span class="notes-qnum">32</span>
            <input id="q32" class="notes-blank" type="text" />
          </span>
          source of renewable energy
        </div>

        <div class="notes-line">Electricity can be generated using offshore or onshore systems</div>
        <div class="notes-line">Onshore systems may use a reservoir</div>

        <div class="notes-line"><strong>Problems:</strong></div>
        <ul class="notes-bullets">
          <li>
            waves can move in any
            <span class="notes-q">
              <span class="notes-qnum">33</span>
              <input id="q33" class="notes-blank" type="text" />
            </span>
          </li>
          <li>
            movement of sand, etc. on the
            <span class="notes-q">
              <span class="notes-qnum">34</span>
              <input id="q34" class="notes-blank" type="text" />
            </span>
            of the ocean may be affected
          </li>
        </ul>
      </div>

      <div class="notes-section">
        <h4>Tidal energy</h4>

        <div class="notes-line">
          Tides are more
          <span class="notes-q">
            <span class="notes-qnum">35</span>
            <input id="q35" class="notes-blank" type="text" />
          </span>
          than waves
        </div>

        <div class="notes-line"><strong>Planned tidal lagoon in Wales:</strong></div>
        <ul class="notes-bullets">
          <li>
            will be created in a
            <span class="notes-q">
              <span class="notes-qnum">36</span>
              <input id="q36" class="notes-blank" type="text" />
            </span>
            at Swansea
          </li>
          <li>breakwater (dam) containing 16 turbines</li>
          <li>rising tide forces water through turbines, generating electricity</li>
          <li>
            stored water is released through
            <span class="notes-q">
              <span class="notes-qnum">37</span>
              <input id="q37" class="notes-blank" type="text" />
            </span>,
            driving the turbines in the reverse direction
          </li>
        </ul>

        <div class="notes-line"><strong>Advantages:</strong></div>
        <ul class="notes-bullets">
          <li>not dependent on weather</li>
          <li>
            no
            <span class="notes-q">
              <span class="notes-qnum">38</span>
              <input id="q38" class="notes-blank" type="text" />
            </span>
            is required to make it work
          </li>
          <li>
            likely to create a number of
            <span class="notes-q">
              <span class="notes-qnum">39</span>
              <input id="q39" class="notes-blank" type="text"  />
            </span>
          </li>
        </ul>

        <div class="notes-line"><strong>Problem:</strong></div>
        <ul class="notes-bullets">
          <li>
            may harm fish and birds, e.g. by affecting
            <span class="notes-q">
              <span class="notes-qnum">40</span>
              <input id="q40" class="notes-blank" type="text" />
            </span>
            and building up silt
          </li>
        </ul>
      </div>

      <div class="notes-section">
        <h4>Ocean thermal energy conversion</h4>
        <div class="notes-line">Uses a difference in temperature between the surface and lower levels</div>
        <div class="notes-line">Water brought to the surface in a pipe</div>
      </div>
    </div>
  `;
}

      // Restore saved answers for this section after rendering
      restoreInputsForSection(sectionIdx);

      // Lock inputs if section already locked
      const st = loadState();
      if (st.lockedSections[String(sectionIdx)]) {
        setSectionInputsDisabled(true);
        qMsg.textContent = "This section is locked (review time ended).";
      } else {
        setSectionInputsDisabled(false);
      }
    }

    // --- HTML builders ---
    function renderText(qNum, label) {
      return `
        <div class="q">
          <label><strong>${qNum}</strong> ${label}<br>
            <input type="text" id="q${qNum}" >
          </label>
        </div>
      `;
    }

    function renderABC(qNum, label) {
      return `
        <div class="q">
          <p><strong>${qNum}</strong> ${label}</p>
          <label class="opt"><input type="radio" name="q${qNum}" value="A"> A</label><br>
          <label class="opt"><input type="radio" name="q${qNum}" value="B"> B</label><br>
          <label class="opt"><input type="radio" name="q${qNum}" value="C"> C</label>
        </div>
      `;
    }

    function renderMCQ(qNum, stem, options) {
      const optsHtml = options.map(([letter, text]) => {
        return `<label class="opt"><input type="radio" name="q${qNum}" value="${letter}"> ${letter} — ${text}</label><br>`;
      }).join("");
      return `
        <div class="q">
          <p><strong>${qNum}</strong> ${stem}</p>
          ${optsHtml}
        </div>
      `;
    }

    function renderAG(qNum, label) {
      return `
        <div class="q">
          <label><strong>${qNum}</strong> ${label}:<br>
            <input type="text" id="q${qNum}" placeholder="A–G">
          </label>
        </div>
      `;
    }

    // ============================================================
    // Two-choice checkbox helpers (11–12, 13–14)
    // ============================================================
    function bindTwoPick(groupName, outId1, outId2) {
      const boxes = Array.from(document.querySelectorAll(`input[name="${groupName}"]`));
      const out1 = document.getElementById(outId1);
      const out2 = document.getElementById(outId2);

      function update() {
        const picked = boxes.filter(b => b.checked).map(b => b.value);
        if (picked.length > 2) {
          const last = boxes.find(b => b === document.activeElement);
          if (last) last.checked = false;
        }
        const picked2 = boxes.filter(b => b.checked).map(b => b.value);
        out1.value = picked2[0] || "";
        out2.value = picked2[1] || "";
      }

      boxes.forEach(b => b.addEventListener("change", update));
      update();
    }

    function bindABCRadios(qNums) {
      qNums.forEach(n => {
        const radios = Array.from(document.querySelectorAll(`input[name="q${n}"]`));
        radios.forEach(r => r.addEventListener("change", () => saveSectionAnswers(getCurrentSectionIdx())));
      });
    }

    function bindMCQRadios(qNums) {
      qNums.forEach(n => {
        const radios = Array.from(document.querySelectorAll(`input[name="q${n}"]`));
        radios.forEach(r => r.addEventListener("change", () => saveSectionAnswers(getCurrentSectionIdx())));
      });
    }

    // ============================================================
    // Section input helpers (save/restore)
    // ============================================================
    function getCurrentSectionIdx() {
      const st = loadState();
      return Number(st.currentSection || 1);
    }

    function setSectionInputsDisabled(disabled) {
      const sec = getCurrentSectionIdx();
      const { qFrom, qTo } = SECTIONS[sec - 1];

      for (let q = qFrom; q <= qTo; q++) {
        const text = document.getElementById(`q${q}`);
        if (text) text.disabled = disabled;
        const radios = document.querySelectorAll(`input[name="q${q}"]`);
        radios.forEach(r => r.disabled = disabled);
      }

      if (sec === 2) {
        document.querySelectorAll(`input[name="q11_12_pick"], input[name="q13_14_pick"]`)
          .forEach(x => x.disabled = disabled);
      }
    }

    function restoreInputsForSection(sectionIdx) {
      const a = loadAnswers();
      const secObj = a.sections[String(sectionIdx)] || {};
      const saved = secObj.answers || {};

      Object.keys(saved).forEach(k => {
        const v = saved[k];
        if (k.startsWith("q")) {
          const el = document.getElementById(k);
          if (el && el.tagName === "INPUT" && el.type === "text") el.value = v;
        }
      });

      for (let q = 1; q <= 40; q++) {
        const key = `q${q}`;
        const v = saved[key];
        if (!v) continue;
        const r = document.querySelector(`input[name="q${q}"][value="${v}"]`);
        if (r) r.checked = true;
      }

      if (sectionIdx === 2) {
        const p1112 = [saved.q11, saved.q12].filter(Boolean);
        const p1314 = [saved.q13, saved.q14].filter(Boolean);

        document.querySelectorAll(`input[name="q11_12_pick"]`).forEach(b => b.checked = false);
        document.querySelectorAll(`input[name="q13_14_pick"]`).forEach(b => b.checked = false);

        p1112.forEach(letter => {
          const b = document.querySelector(`input[name="q11_12_pick"][value="${letter}"]`);
          if (b) b.checked = true;
        });
        p1314.forEach(letter => {
          const b = document.querySelector(`input[name="q13_14_pick"][value="${letter}"]`);
          if (b) b.checked = true;
        });

        bindTwoPick("q11_12_pick", "q11", "q12");
        bindTwoPick("q13_14_pick", "q13", "q14");
      }

      const st = loadState();
      if (!st.lockedSections[String(sectionIdx)]) {
        const { qFrom, qTo } = SECTIONS[sectionIdx - 1];
        for (let q = qFrom; q <= qTo; q++) {
          const t = document.getElementById(`q${q}`);
          if (t && t.type === "text") {
            t.addEventListener("input", () => saveSectionAnswers(sectionIdx));
          }
        }
      }
    }

    function saveSectionAnswers(sectionIdx) {
      const a = loadAnswers();
      if (!a.sections[String(sectionIdx)]) a.sections[String(sectionIdx)] = {};
      const sec = a.sections[String(sectionIdx)];

      const answers = {};
      const { qFrom, qTo } = SECTIONS[sectionIdx - 1];

      for (let q = qFrom; q <= qTo; q++) {
        const text = document.getElementById(`q${q}`);
        if (text && text.type === "text") {
          answers[`q${q}`] = (text.value || "").trim();
        } else {
          const picked = document.querySelector(`input[name="q${q}"]:checked`);
          if (picked) answers[`q${q}`] = picked.value;
          else answers[`q${q}`] = answers[`q${q}`] || "";
        }
      }

      if (sectionIdx === 2) {
        answers.q11 = (document.getElementById("q11")?.value || "").trim();
        answers.q12 = (document.getElementById("q12")?.value || "").trim();
        answers.q13 = (document.getElementById("q13")?.value || "").trim();
        answers.q14 = (document.getElementById("q14")?.value || "").trim();
      }

      sec.answers = answers;
      sec.saved_at = new Date().toISOString();
      saveAnswers(a);
    }

    function validateSectionAnswered(sectionIdx) {
      const a = loadAnswers();
      const sec = a.sections[String(sectionIdx)];
      const saved = (sec && sec.answers) ? sec.answers : {};

      const { qFrom, qTo } = SECTIONS[sectionIdx - 1];
      for (let q = qFrom; q <= qTo; q++) {
        const key = `q${q}`;
        const v = (saved[key] || "").trim();
        if (!v) return `Question ${q} is unanswered.`;
      }
      if (sectionIdx === 2) {
        if (!saved.q11 || !saved.q12) return "Questions 11–12: please choose TWO options.";
        if (!saved.q13 || !saved.q14) return "Questions 13–14: please choose TWO options.";
      }
      return null;
    }

    // ============================================================
    // Audio: play once (persist), plus resume, plus progress
    // ============================================================
    function loadAudioForSection(sectionIdx) {
      const st = loadState();
      const meta = st.sectionAudio[String(sectionIdx)] || { started:false, ended:false, lastTime:0, duration:0 };
      st.sectionAudio[String(sectionIdx)] = meta;
      saveState(st);
	  lastAllowedTime = meta.lastTime || 0;
      const sec = SECTIONS[sectionIdx - 1];
      audio.src = sec.audioSrc;
	  if (meta.started && !meta.ended) audio.load();
      if (meta.started && !meta.ended) resumeBtn.classList.remove("hidden");
      else resumeBtn.classList.add("hidden");

      playBtn.disabled = !!meta.started;

      audioProgress.value = 0;
      audioProgressText.textContent = "00:00 / 00:00";
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2,"0");
      const s = Math.floor(sec % 60).toString().padStart(2,"0");
      return `${m}:${s}`;
    }

    function updateProgressUI() {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      if (dur > 0) {
        audioProgress.value = Math.min(100, Math.floor((cur / dur) * 100));
        audioProgressText.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      } else {
        audioProgress.value = 0;
        audioProgressText.textContent = `${formatTime(cur)} / 00:00`;
      }
    }

    let lastAllowedTime = 0;

    audio.addEventListener("timeupdate", () => {
      updateProgressUI();
      const st = loadState();
      const secIdx = getCurrentSectionIdx();
      const meta = st.sectionAudio[String(secIdx)] || {};
      meta.lastTime = audio.currentTime || 0;
      meta.duration = audio.duration || 0;
      st.sectionAudio[String(secIdx)] = meta;
      saveState(st);
      lastAllowedTime = Math.max(lastAllowedTime, audio.currentTime || 0);
    });
	
	

	audio.addEventListener("seeking", () => {
	  const cur = audio.currentTime || 0;

	  // allow forward seeks (or tiny jitter)
	  if (cur + 0.5 >= lastAllowedTime) return;

	  // block rewinds
	  audio.currentTime = lastAllowedTime;
	});


	audio.addEventListener("ended", async () => {
	  const st = loadState();
	  const secIdx = getCurrentSectionIdx();

	  // Mark current section audio as ended
	  const meta = st.sectionAudio[String(secIdx)] || { started: true, ended: false, lastTime: 0, duration: 0 };
	  meta.ended = true;
	  st.sectionAudio[String(secIdx)] = meta;

	  // Save + lock current section immediately
	  saveSectionAnswers(secIdx);
	  st.lockedSections[String(secIdx)] = true;

	  // ✅ Sections 1–3: move straight to next section
	  if (secIdx < 4) {
		const nextIdx = secIdx + 1;

		// Move state to next section
		st.currentSection = nextIdx;

		// Ensure next section has a clean audio meta (so Play isn't "stuck" disabled)
		st.sectionAudio[String(nextIdx)] = st.sectionAudio[String(nextIdx)] || { started: false, ended: false, lastTime: 0, duration: 0 };

		saveState(st);

		// Render the next section UI + load its audio
		loadCurrentSection();

		// Try autoplay next audio (may be blocked by browser)
		try {
		  // Prime "started" so you still enforce play-once
		  const st2 = loadState();
		  st2.sectionAudio[String(nextIdx)].started = true;
		  st2.sectionAudio[String(nextIdx)].ended = false;
		  st2.sectionAudio[String(nextIdx)].lastTime = 0;
		  saveState(st2);

		  playBtn.disabled = true;
		  resumeBtn.classList.add("hidden");
		  lastAllowedTime = 0;

		  await audio.play();
		} catch (e) {
		  // Autoplay blocked → allow manual play
		  const st2 = loadState();
		  st2.sectionAudio[String(nextIdx)].started = false; // let them press Play
		  saveState(st2);

		  playBtn.disabled = false;
		  qMsg.textContent = "Press Play to start the next section.";
		}

		return;
	  }

	  // ✅ Section 4 only: do the 2-minute review timer
	  saveState(st);
	  startReviewTimer(secIdx);

	  playBtn.disabled = true;
	  resumeBtn.classList.add("hidden");
	});

	// ============================================================
	// Resume helper: seek only after metadata is ready
	// ============================================================
	let pendingSeekTime = null;

	function seekWhenReady(t) {
	  pendingSeekTime = Math.max(0, Number(t) || 0);

	  // If metadata already loaded, seek immediately
	  if (audio.readyState >= 1) {
		audio.currentTime = pendingSeekTime;
		lastAllowedTime = pendingSeekTime;
		pendingSeekTime = null;
		updateProgressUI();
		return;
	  }

	  // Otherwise wait for metadata
	  audio.addEventListener("loadedmetadata", function onMeta() {
		audio.removeEventListener("loadedmetadata", onMeta);
		if (pendingSeekTime != null) {
		  audio.currentTime = pendingSeekTime;
		  lastAllowedTime = pendingSeekTime;
		  pendingSeekTime = null;
		  updateProgressUI();
		}
	  }, { once: true });

	  // Force metadata load
	  audio.load();
	}


    playBtn.addEventListener("click", async () => {
      topMsg.textContent = "";
      qMsg.textContent = "";

      const st = loadState();
      const secIdx = getCurrentSectionIdx();
      const meta = st.sectionAudio[String(secIdx)] || { started:false, ended:false, lastTime:0 };
      meta.started = true;
      meta.ended = false;
      meta.lastTime = 0;
      st.sectionAudio[String(secIdx)] = meta;
      saveState(st);

      playBtn.disabled = true;
      resumeBtn.classList.add("hidden");
      lastAllowedTime = 0;

      try { await audio.play(); }
      catch (e) { console.error(e); topMsg.textContent = "Audio couldn’t start. Try tapping Play again."; }
    });

	resumeBtn.addEventListener("click", async () => {
	  topMsg.textContent = "";
	  const st = loadState();
	  const secIdx = getCurrentSectionIdx();
	  const meta = st.sectionAudio[String(secIdx)];
	  if (!meta || !meta.started || meta.ended) return;

	  try {
		seekWhenReady(meta.lastTime || 0);
		await audio.play();
	  } catch (e) {
		console.error(e);
		topMsg.textContent = "Audio couldn’t resume. Try again.";
	  }
	});


    // ============================================================
    // Review timer (unchanged)
    // ============================================================
    let reviewTick = null;

    function startReviewTimer(sectionIdx) {
      const st = loadState();
      if (!st.reviewEndTsBySection[String(sectionIdx)]) {
        st.reviewEndTsBySection[String(sectionIdx)] = nowMs() + (REVIEW_SECONDS * 1000);
        saveState(st);
      }

      setSectionInputsDisabled(false);
      nextBtn.disabled = true;

      if (reviewTick) clearInterval(reviewTick);
      reviewTick = setInterval(() => {
        renderReviewTime();
        if (isReviewOver(sectionIdx)) {
          clearInterval(reviewTick);
          reviewTick = null;
          finalizeSection(sectionIdx);
        }
      }, 250);

      renderReviewTime();
    }

    function isReviewOver(sectionIdx) {
      const st = loadState();
      const endTs = st.reviewEndTsBySection[String(sectionIdx)] || 0;
      return endTs > 0 && nowMs() >= endTs;
    }

    function renderReviewTime() {
      const st = loadState();
      const secIdx = getCurrentSectionIdx();
      const endTs = st.reviewEndTsBySection[String(secIdx)] || 0;

      if (!endTs) {
        reviewTimeEl.textContent = "--:--";
        reviewTimeEl.classList.remove("danger");
        return;
      }

      const remaining = Math.max(0, Math.floor((endTs - nowMs()) / 1000));
      reviewTimeEl.textContent = formatTime(remaining);
      if (remaining <= 10) reviewTimeEl.classList.add("danger");
      else reviewTimeEl.classList.remove("danger");
    }

    function finalizeSection(sectionIdx) {
      saveSectionAnswers(sectionIdx);

      const err = validateSectionAnswered(sectionIdx);
      if (err) {
        qMsg.textContent = err + " Please answer and wait for the timer to finish again.";
        const st = loadState();
        st.reviewEndTsBySection[String(sectionIdx)] = nowMs() + (15 * 1000);
        saveState(st);
        startReviewTimer(sectionIdx);
        return;
      }

      const st = loadState();
      st.lockedSections[String(sectionIdx)] = true;
      saveState(st);

      setSectionInputsDisabled(true);
      nextBtn.disabled = false;

      qMsg.textContent = "Section locked. You can continue.";
      updateStatusUI();
    }

    // ============================================================
    // Navigation / submit (unchanged)
    // ============================================================
    nextBtn.addEventListener("click", async () => {
      qMsg.textContent = "";
      const st = loadState();
      const secIdx = getCurrentSectionIdx();

      if (!st.lockedSections[String(secIdx)]) {
        qMsg.textContent = "You can continue after the 2-minute review ends.";
        return;
      }

      if (secIdx < 4) {
        st.currentSection = secIdx + 1;
        saveState(st);
        loadCurrentSection();
        return;
      }

      await submitListeningAndGoNext();
    });

    async function submitListeningAndGoNext() {
      qMsg.textContent = "";
      topMsg.textContent = "";

      const a = loadAnswers();
      a.completed = true;
      a.completed_at = new Date().toISOString();
      saveAnswers(a);

      const payload = {
        submission_id: submissionId,
        lead,
        answers: {
          listening: {
            test_id: TEST_ID,
            sections: a.sections,
            completed: true
          }
        }
      };

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        if (!res.ok) {
          topMsg.textContent = "Submit failed: " + text;
          return;
        }
      } catch (e) {
        console.error(e);
        topMsg.textContent = "Network error submitting. Please try again.";
        return;
      }

      window.location.assign("/writing.html");
    }

    // ============================================================
    // Status UI + load section (unchanged)
    // ============================================================
    function updateStatusUI() {
      const st = loadState();
      const secIdx = getCurrentSectionIdx();
      const locked = !!st.lockedSections[String(secIdx)];
      const meta = st.sectionAudio[String(secIdx)] || { started:false, ended:false };

      sectionStatus.textContent =
        `Section ${secIdx}/4 • Audio: ` +
        (meta.started ? (meta.ended ? "played" : "in progress") : "not played") +
        ` • Answers: ` + (locked ? "locked" : "editable");
    }

    function loadCurrentSection() {
      const st = loadState();
      const secIdx = getCurrentSectionIdx();

      renderSectionQuestions(secIdx);
      loadAudioForSection(secIdx);

      const meta = st.sectionAudio[String(secIdx)] || {};
      if (meta.ended) {
        if (st.reviewEndTsBySection[String(secIdx)] && !isReviewOver(secIdx) && !st.lockedSections[String(secIdx)]) {
          startReviewTimer(secIdx);
        }
        if (st.reviewEndTsBySection[String(secIdx)] && isReviewOver(secIdx) && !st.lockedSections[String(secIdx)]) {
          finalizeSection(secIdx);
        }
        if (st.lockedSections[String(secIdx)]) nextBtn.disabled = false;
      } else {
        reviewTimeEl.textContent = "--:--";
        nextBtn.disabled = true;
      }

      updateProgressUI();
      updateStatusUI();
      sectionTitle.textContent = SECTIONS[secIdx - 1].title;
    }

    document.addEventListener("change", () => {
      const secIdx = getCurrentSectionIdx();
      const st = loadState();
      if (st.lockedSections[String(secIdx)]) return;
      saveSectionAnswers(secIdx);
    });

    loadCurrentSection();

    function bindTwoPickAutosave() {
      const secIdx = getCurrentSectionIdx();
      if (secIdx !== 2) return;
      ["q11","q12","q13","q14"].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("input", () => saveSectionAnswers(2));
      });
    }
    bindTwoPickAutosave();
  </script>

</body>
