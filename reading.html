<script>
/* =========================================================
   GUARD — must start from landing page
   ========================================================= */
const lead = JSON.parse(localStorage.getItem("mock_lead") || "null");
const submissionId = localStorage.getItem("mock_submission_id");

if (!lead || !lead.name || !lead.email || !submissionId) {
  window.location.href = "index.html";
}

/* =========================================================
   TIMER (persists across refresh)
   ========================================================= */
const TOTAL_SECONDS = 23 * 60;
const TIMER_KEY = "reading_start_ts_IELTS11_R1_P1";

let startTs = localStorage.getItem(TIMER_KEY);
if (!startTs) {
  startTs = Date.now();
  localStorage.setItem(TIMER_KEY, String(startTs));
} else {
  startTs = parseInt(startTs, 10);
}

function computeRemaining() {
  const elapsed = Math.floor((Date.now() - startTs) / 1000);
  return Math.max(0, TOTAL_SECONDS - elapsed);
}

let remaining = computeRemaining();

const timeLeftEl = document.getElementById("timeLeft");
const timerBox = document.getElementById("timerBox");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

function renderTime() {
  const m = Math.floor(remaining / 60).toString().padStart(2, "0");
  const s = (remaining % 60).toString().padStart(2, "0");
  timeLeftEl.textContent = `${m}:${s}`;

  timerBox.classList.remove("warning", "danger");
  if (remaining <= 5 * 60) timerBox.classList.add("danger");
  else if (remaining <= 10 * 60) timerBox.classList.add("warning");
}

renderTime();

const tick = setInterval(() => {
  remaining = computeRemaining();
  renderTime();

  if (remaining <= 0) {
    clearInterval(tick);
    submitBtn.disabled = true;
    msg.textContent = "Time is up. Please submit what you have.";
  }
}, 1000);

/* =========================================================
   COPY / FIND / PRINT BLOCK (best-effort)
   ========================================================= */
function showHint(text) {
  msg.textContent = text;
  setTimeout(() => { msg.textContent = ""; }, 2500);
}

document.addEventListener("keydown", (e) => {
  const key = (e.key || "").toLowerCase();
  const isMac = navigator.platform.toUpperCase().includes("MAC");
  const ctrlOrCmd = isMac ? e.metaKey : e.ctrlKey;

  if (ctrlOrCmd && ["f", "c", "p"].includes(key)) {
    e.preventDefault();
    showHint("This action is disabled during the reading test.");
  }
});

const passageEl = document.getElementById("passage");
if (passageEl) {
  passageEl.addEventListener("contextmenu", e => {
    e.preventDefault();
    showHint("Copy is disabled during the reading test.");
  });
}

/* =========================================================
   HIGHLIGHTER (persistent)
   ========================================================= */
let highlightOn = false;
const hlToggle = document.getElementById("hlToggle");
const hlClear = document.getElementById("hlClear");
const hlColor = document.getElementById("hlColor");

const HIGHLIGHT_STORE_KEY = "reading_highlights_IELTS11_R1_P1";
const COLOR_STORE_KEY = "reading_highlight_color_IELTS11_R1_P1";

function saveHighlights() {
  localStorage.setItem(HIGHLIGHT_STORE_KEY, passageEl.innerHTML);
}

function restoreHighlights() {
  const saved = localStorage.getItem(HIGHLIGHT_STORE_KEY);
  if (saved) passageEl.innerHTML = saved;
}

function unwrapMark(mark) {
  const parent = mark.parentNode;
  while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
  parent.removeChild(mark);
}

restoreHighlights();

hlToggle.addEventListener("click", () => {
  highlightOn = !highlightOn;
  hlToggle.textContent = highlightOn ? "Highlight: ON" : "Highlight: OFF";
});

hlClear.addEventListener("click", () => {
  passageEl.querySelectorAll("mark.hl").forEach(unwrapMark);
  localStorage.removeItem(HIGHLIGHT_STORE_KEY);
});

hlColor.addEventListener("change", () => {
  localStorage.setItem(COLOR_STORE_KEY, hlColor.value);
  document.documentElement.style.setProperty("--hl-color", hlColor.value);
});

(function initColor() {
  const saved = localStorage.getItem(COLOR_STORE_KEY);
  if (saved) {
    hlColor.value = saved;
    document.documentElement.style.setProperty("--hl-color", saved);
  }
})();

passageEl.addEventListener("mouseup", () => {
  if (!highlightOn) return;
  const sel = window.getSelection();
  if (!sel || !sel.toString().trim()) return;

  const range = sel.getRangeAt(0);
  if (!passageEl.contains(range.commonAncestorContainer)) return;

  const mark = document.createElement("mark");
  mark.className = "hl";

  try {
    range.surroundContents(mark);
    sel.removeAllRanges();
    saveHighlights();
  } catch {
    sel.removeAllRanges();
  }
});

/* =========================================================
   ANSWERS + SUBMIT
   ========================================================= */
function getRadio(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : "";
}

function collectAnswers() {
  const a = {};
  [1,2,3,4,8,9,10,11,12,13].forEach(n => {
    a[`q${n}`] = document.getElementById(`q${n}`).value.trim();
  });
  a.q5 = getRadio("q5");
  a.q6 = getRadio("q6");
  a.q7 = getRadio("q7");
  return a;
}

function validateAnswers(a) {
  for (let i = 1; i <= 13; i++) {
    if (!a[`q${i}`]) return `Question ${i} is unanswered.`;
  }
  return null;
}

submitBtn.addEventListener("click", async () => {
  msg.textContent = "";

  if (remaining <= 0) {
    msg.textContent = "Time is up. Please submit what you have.";
    return;
  }

  const answers = collectAnswers();
  const err = validateAnswers(answers);
  if (err) {
    msg.textContent = err;
    return;
  }

  const payload = {
    submission_id: submissionId,
    lead,
    answers: {
      reading: {
        test_id: "IELTS11_R1_P1",
        seconds_left: remaining,
        duration_seconds: TOTAL_SECONDS,
        answers
      }
    }
  };

  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      msg.textContent = "Submit failed. Please contact staff.";
      return;
    }
  } catch (e) {
    msg.textContent = "Network error. Please try again.";
    return;
  }

  localStorage.removeItem(TIMER_KEY);
  window.location.href = "thank-you.html";
});
</script>
