<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IELTS Mock Exam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>IELTS Mock Exam</h1>

    <p class="lead">
      Take an IELTS-style mock test covering <strong>Reading, Listening and Writing,</strong>.
    </p>

    <p class="muted">
      Your answers will be reviewed by an examiner.
      <strong>Results are not shown on-screen</strong> — we’ll contact you directly with feedback.
    </p>

    <div class="card">
      <h2>Enter your details to receive your results</h2>

      <label>
        Full Name <span class="required">*</span><br />
        <input id="leadName" type="text" placeholder="Your name" />
      </label>

      <br /><br />

      <label>
        Email Address <span class="required">*</span><br />
        <input id="leadEmail" type="email" placeholder="you@example.com" />
      </label>

      <br /><br />

      <label>
        WhatsApp (optional)<br />
        <input id="leadWhatsApp" type="text" placeholder="+77…" />
      </label>

      <br /><br />

      <label class="checkbox">
        <input id="leadConsent" type="checkbox" />
        I consent to be contacted with my IELTS mock test results.
      </label>

      <p class="error" id="formError" style="min-height:1.2em;"></p>

      <button id="startBtn" class="btn" type="button">Start Mock Exam</button>
    </div>
  </main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const leadName = document.getElementById("leadName");
  const leadEmail = document.getElementById("leadEmail");
  const leadWhatsApp = document.getElementById("leadWhatsApp");
  const leadConsent = document.getElementById("leadConsent");
  const formError = document.getElementById("formError");
  const startBtn = document.getElementById("startBtn");

  startBtn.addEventListener("click", () => {
    // 1) Read values
    const name = (leadName.value || "").trim();
    const email = (leadEmail.value || "").trim();
    const whatsapp = (leadWhatsApp.value || "").trim();
    const consent = leadConsent.checked;

    formError.textContent = "";

    // 2) Validate FIRST
    if (!name || !email) {
      formError.textContent = "Please enter your name and email.";
      return;
    }
    if (!consent) {
      formError.textContent = "Please give consent so we can contact you.";
      return;
    }

    // 3) Save lead
    localStorage.setItem("mock_lead", JSON.stringify({ name, email, whatsapp, consent }));

    // 4) Resume if unfinished attempt exists
    const submissionId = localStorage.getItem("mock_submission_id");
    if (submissionId && localStorage.getItem(`reading_started_${submissionId}`) === "1") {
      window.location.assign("/reading.html");
      return;
    }

    // 5) Start NEW attempt (clear previous attempt data)
    const oldId = localStorage.getItem("mock_submission_id");

    const newId = "sub_" + crypto.randomUUID();
    localStorage.setItem("mock_submission_id", newId);

    if (oldId) {
      localStorage.removeItem(`mock_reading_answers_${oldId}`);
      localStorage.removeItem(`reading_state_${oldId}`);
      localStorage.removeItem(`reading_started_${oldId}`);

      localStorage.removeItem(`mock_listening_answers_${oldId}`);
      localStorage.removeItem(`listening_state_${oldId}`);

      localStorage.removeItem(`writing_state_${oldId}`);
      localStorage.removeItem(`writing_answers_${oldId}`);
    }

    // ✅ Start test
    window.location.assign("/reading.html");
  });
});
</script>


</body>
</html>
