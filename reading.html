<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IELTS Mock Exam — Reading</title>
  <link rel="stylesheet" href="style.css" />

  <style>

/* ============================================================
   PASSAGE SECTION LETTER BLOCKS (A–G) — for Passage 2+
   ============================================================ */
.psec { display:flex; gap:12px; align-items:flex-start; margin: 10px 0 14px; }
.psec-badge{
  width: 28px; height: 28px; border-radius: 6px;
  border:1px solid rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; flex: 0 0 auto;
}
.psec-body p{ margin: 0 0 10px; line-height: 1.55; }
.psec-body p:last-child{ margin-bottom: 0; }

/* ============================================================
   QUESTION BLOCKS (match screenshot instructions)
   ============================================================ */
.qblock { margin: 14px 0; }
.qblock h3 { margin: 0 0 8px; font-size: 1.05em; }
.qnote { padding:10px 12px; border-radius:10px; background: rgba(0,0,0,.04); margin: 10px 0 12px; }

.match-row{
  display:grid;
  grid-template-columns: 64px 1fr;
  gap: 10px;
  align-items: start;
  padding: 8px 0;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.match-row:last-child{ border-bottom:0; }
.match-row input[type="text"]{
  width: 54px; padding: 6px 8px; text-transform: uppercase;
}

.summarybox{
  border:1px solid rgba(0,0,0,.12);
  border-radius: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,.02);
}
.summarybox p{ margin: 0 0 10px; line-height: 1.55; }
.summarybox p:last-child{ margin-bottom:0; }
.summarybox input[type="text"]{ max-width: 240px; }

.twopick{
  border:1px solid rgba(0,0,0,.12);
  border-radius: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,.02);
}
.twopick label{ display:block; margin: 6px 0; }
.twopick .ansrow{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 10px; }
.twopick .ansrow input[type="text"]{ width: 60px; padding: 6px 8px; text-transform: uppercase; }



    /* ============================================================
       SAFE HELPERS (won’t fight your style.css)
       ============================================================ */
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .spacer { height: 12px; }
    .hidden { display:none !important; }
    .notice { padding:10px 12px; border-radius:10px; background: rgba(0,0,0,.04); }
    .danger { color:#b00020; }
    .small { font-size: .9em; opacity: .85; }
    .q { margin: 10px 0; }
    .q input[type="text"] { max-width: 380px; }

    .reading-layout { display:grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
    @media (max-width: 950px){ .reading-layout { grid-template-columns: 1fr; } }

    .passage-box { border:1px solid #ddd; border-radius:10px; padding:12px; background:#fff; }
    .passage-text { white-space: pre-wrap; line-height:1.5; }

    .pill { border:1px solid #ddd; border-radius:999px; padding:6px 10px; background:#fff; }
    .pill.active { border-color:#111; font-weight:800; }

    .stickyBar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom:1px solid #eee; padding:10px 0; }
  </style>
</head>

<body>
  <main class="container">

    <!-- ============================================================
         STICKY TOP BAR
         ============================================================ -->
    <div class="stickyBar">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <strong>Reading</strong>
          <span class="small" id="testName">Loading…</span>
        </div>

        <div class="row">
          <div class="notice">
            Time left: <strong id="timeLeft">60:00</strong>
          </div>
          <button id="submitBtn" class="btn" type="button">Finish Reading</button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="row" id="passageTabs"></div>
      <p id="topMsg" class="error" style="min-height:1.2em; margin:8px 0 0;"></p>
    </div>

    <div class="spacer"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <div class="reading-layout">

      <!-- LEFT: PASSAGE -->
      <div class="card passage-box">
        <h2 id="passageTitle">Passage</h2>
        <div class="small" id="passageMeta"></div>
        <div class="spacer"></div>
        <div id="passageText" class="passage-text">Loading…</div>
      </div>

      <!-- RIGHT: QUESTIONS -->
      <div class="card">
        <h2 id="questionsTitle">Questions</h2>
        <div id="questions"></div>
        <p id="qMsg" class="error" style="min-height:1.2em;"></p>

        <div class="spacer"></div>
        <div class="row">
          <button id="prevBtn" class="btn secondary" type="button">Previous Passage</button>
          <button id="nextBtn" class="btn secondary" type="button">Next Passage</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ============================================================
    // GUARD: must start from landing page (index.html)
    // ============================================================
    (function guard() {
      let lead = null;
      try { lead = JSON.parse(localStorage.getItem("mock_lead") || "null"); } catch {}
      const submissionId = localStorage.getItem("mock_submission_id");
      if (!lead || !lead.name || !lead.email || !submissionId) {
        window.location.assign("/index.html");
      }
    })();

    // ============================================================
    // CONFIG (change only if you rename files)
    // ============================================================
    const TEST_JSON_PATH = "/reading/test-101.json"; // <-- your naming convention
    const DEFAULT_TIME_MIN = 60;

    // Storage keys (scoped per submission)
    const submissionId = localStorage.getItem("mock_submission_id");
    const lead = JSON.parse(localStorage.getItem("mock_lead") || "null");

    const KEY = {
      STATE: `reading_state_${submissionId}`,          // { currentPassageIdx, endTs }
      ANSWERS: `mock_reading_answers_${submissionId}`  // { test_id, passages:{1:{answers:{}},...}, completed }
    };

    // ============================================================
    // DOM
    // ============================================================
    const testName = document.getElementById("testName");
    const topMsg = document.getElementById("topMsg");
    const timeLeftEl = document.getElementById("timeLeft");

    const passageTabs = document.getElementById("passageTabs");
    const passageTitle = document.getElementById("passageTitle");
    const passageMeta = document.getElementById("passageMeta");
    const passageText = document.getElementById("passageText");

    const questionsTitle = document.getElementById("questionsTitle");
    const questionsEl = document.getElementById("questions");
    const qMsg = document.getElementById("qMsg");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");

    // ============================================================
    // STATE HELPERS
    // ============================================================
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(KEY.STATE) || "null"); } catch {}
      if (!s || typeof s !== "object") {
        s = {
          currentPassageIdx: 0, // 0-based index
          endTs: 0
        };
        saveState(s);
      }
      return s;
    }

    function saveState(s) {
      localStorage.setItem(KEY.STATE, JSON.stringify(s));
    }

    function loadAnswers() {
      let a = null;
      try { a = JSON.parse(localStorage.getItem(KEY.ANSWERS) || "null"); } catch {}
      if (!a || typeof a !== "object") {
        a = { test_id: "", passages: {}, completed: false };
        localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
      }
      return a;
    }

    function saveAnswers(a) {
      localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
    }

    function nowMs(){ return Date.now(); }

    // ============================================================
    // TIMER (simple 60-min reading timer)
    // ============================================================
    let timerTick = null;

    function startTimerIfNeeded(minutes) {
      const st = loadState();
      if (!st.endTs) {
        st.endTs = nowMs() + (minutes * 60 * 1000);
        saveState(st);
      }
      if (timerTick) clearInterval(timerTick);
      timerTick = setInterval(renderTimeLeft, 250);
      renderTimeLeft();
    }

    function renderTimeLeft() {
      const st = loadState();
      const remaining = Math.max(0, Math.floor((st.endTs - nowMs()) / 1000));
      const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
      const ss = String(remaining % 60).padStart(2, "0");
      timeLeftEl.textContent = `${mm}:${ss}`;
      if (remaining <= 60) timeLeftEl.classList.add("danger");
      else timeLeftEl.classList.remove("danger");
    }

    // ============================================================
    // LOAD TEST JSON
    // ============================================================
    let TEST = null; // loaded JSON

    async function loadTest() {
      topMsg.textContent = "";
      try {
        const res = await fetch(TEST_JSON_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error(await res.text());
        TEST = await res.json();
      } catch (e) {
        console.error(e);
        topMsg.textContent = "Could not load the reading test JSON. Check the file path and JSON syntax.";
        return false;
      }
      return true;
    }

    // ============================================================
    // RENDER UI
    // ============================================================
    function currentPassage() {
      const st = loadState();
      return TEST.passages[st.currentPassageIdx];
    }

    function renderTabs() {
      passageTabs.innerHTML = "";
      const st = loadState();

      TEST.passages.forEach((p, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (idx === st.currentPassageIdx ? " active" : "");
        b.textContent = `Passage ${p.id}`;
        b.addEventListener("click", () => {
          // Save current passage answers before switching
          saveCurrentPassageAnswers();
          st.currentPassageIdx = idx;
          saveState(st);
          renderAll();
        });
        passageTabs.appendChild(b);
      });
    }

function renderPassage() {
  const p = currentPassage();
  passageTitle.textContent = `Reading Passage ${p.id}: ${p.title}`;
  passageMeta.textContent = p.subtitle ? p.subtitle : "";

  // If passage has A–G sections, render nicely (fixes Passage 2 typography)
  if (Array.isArray(p.sections) && p.sections.length) {
    passageText.innerHTML = p.sections.map(sec => {
      const paras = (sec.paragraphs || []).map(t => `<p>${escapeHtml(t)}</p>`).join("");
      return `
        <div class="psec">
          <div class="psec-badge">${escapeHtml(sec.letter || "")}</div>
          <div class="psec-body">${paras}</div>
        </div>
      `;
    }).join("");
    return;
  }

  // Default: plain text
  passageText.textContent = p.text || "";
}

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderSummaryLine(p, qNum) {
  const q = p.questions.find(x => x.number === qNum);
  if (!q) return "";
  return `
    <p>
      ${escapeHtml(q.prompt)}
      <strong>${qNum}</strong>
      <input type="text" id="q${qNum}" placeholder="${escapeHtml(q.placeholder || "NO MORE THAN TWO WORDS")}">
      ${escapeHtml(q.after || "")}
    </p>
  `;
}

function renderTwoPickBlock(p, qA, qB, heading, noteHtml) {
  const q = p.questions.find(x => x.number === qA && x.type === "two_pick");
  if (!q) return "";

  const groupName = (qA === 23) ? "tp_23_24" : "tp_25_26";

  const opts = (q.options || []).map(([letter, text]) => {
    return `<label><input type="checkbox" name="${groupName}" value="${escapeHtml(letter)}"> <strong>${escapeHtml(letter)}</strong> ${escapeHtml(text)}</label>`;
  }).join("");

  return `
    <div class="qblock">
      <h3>${escapeHtml(heading)}</h3>
      <div class="qnote">${noteHtml}</div>

      <div class="twopick">
        <p style="font-weight:800; margin:0 0 10px;">${escapeHtml(q.prompt)}</p>
        ${opts}

        <div class="ansrow">
          <label><strong>${qA}</strong> <input type="text" id="q${qA}" placeholder="A–E" readonly></label>
          <label><strong>${qB}</strong> <input type="text" id="q${qB}" placeholder="A–E" readonly></label>
        </div>

        <div class="small" style="margin-top:6px;">Pick exactly 2 options (auto-fills ${qA} and ${qB}).</div>
      </div>
    </div>
  `;
}

function initTwoPickGroup(groupName, outId1, outId2) {
  const boxes = Array.from(document.querySelectorAll(`input[name="${groupName}"]`));
  const out1 = document.getElementById(outId1);
  const out2 = document.getElementById(outId2);
  if (!boxes.length || !out1 || !out2) return;

  function update(changedBox) {
    const checked = boxes.filter(b => b.checked).map(b => b.value);

    // Prevent selecting more than 2
    if (checked.length > 2 && changedBox) changedBox.checked = false;

    const picked = boxes.filter(b => b.checked).map(b => b.value);
    out1.value = picked[0] || "";
    out2.value = picked[1] || "";

    saveCurrentPassageAnswers();
  }

  boxes.forEach(b => b.addEventListener("change", () => update(b)));
}



function renderQuestions() {
  qMsg.textContent = "";
  const p = currentPassage();

  questionsTitle.textContent = `Questions (Passage ${p.id})`;

  // Build HTML based on question types (starting with Passage 2 needs)
  let html = "";

  // Passage 2 instruction blocks (exactly like the screenshot)
  if (p.id === 2) {
    html += `
      <div class="qblock">
        <h3>Questions 14–18</h3>
        <div class="qnote">
          Reading Passage 2 has seven sections, <strong>A–G</strong>.<br>
          Which section contains the following information?<br><br>
          Write the correct letter, <strong>A–G</strong>, in boxes 14–18 on your answer sheet.
        </div>
        ${p.questions.filter(q => q.type === "section_match").map(q => `
          <div class="match-row">
            <div>
              <input type="text" id="q${q.number}" maxlength="1" placeholder="A–G">
            </div>
            <div><strong>${q.number}</strong> ${escapeHtml(q.prompt)}</div>
          </div>
        `).join("")}
      </div>

      <hr>

      <div class="qblock">
        <h3>Questions 19–22</h3>
        <div class="qnote">
          Complete the summary below.<br>
          Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.<br>
          Write your answers in boxes 19–22 on your answer sheet.
        </div>

        <div class="summarybox">
          <p style="font-weight:800; margin-bottom:10px;">The impact of driverless cars</p>

          ${renderSummaryLine(p, 19)}
          ${renderSummaryLine(p, 20)}
          <p style="margin-top:12px;"></p>
          ${renderSummaryLine(p, 21)}
          ${renderSummaryLine(p, 22)}

          <p style="margin-top:12px;">
            This would lead to a higher turnover of vehicles, and therefore no reduction in automotive manufacturing.
          </p>
        </div>
      </div>

      <hr>

      ${renderTwoPickBlock(p, 23, 24, "Questions 23 and 24", "Choose <strong>TWO</strong> letters, <strong>A–E</strong>.<br>Write the correct letters in boxes 23 and 24 on your answer sheet.")}
      <hr>
      ${renderTwoPickBlock(p, 25, 26, "Questions 25 and 26", "Choose <strong>TWO</strong> letters, <strong>A–E</strong>.<br>Write the correct letters in boxes 25 and 26 on your answer sheet.")}
    `;
  } else {
    // Keep your old simple fallback for other passages (unchanged)
    html = p.questions.map(q => {
      return `
        <div class="q">
          <label>
            <strong>${q.number}</strong> ${q.prompt}
            <br>
            <input type="text" id="q${q.number}" placeholder="${q.placeholder || "Answer"}">
          </label>
        </div>
      `;
    }).join("");
  }

  questionsEl.innerHTML = html;

  // Restore answers for this passage
  restorePassageAnswers(p.id);

  // Bind autosave for Passage 2 controls
  if (p.id === 2) {
    // Text inputs
    p.questions.forEach(q => {
      const el = document.getElementById(`q${q.number}`);
      if (el && el.tagName === "INPUT") {
        el.addEventListener("input", () => saveCurrentPassageAnswers());
      }
    });

    // Two-pick checkboxes (auto-fill boxes + enforce exactly 2)
    initTwoPickGroup("tp_23_24", "q23", "q24");
    initTwoPickGroup("tp_25_26", "q25", "q26");
  } else {
    // Your old autosave for fallback
    p.questions.forEach(q => {
      const el = document.getElementById(`q${q.number}`);
      if (!el) return;
      el.addEventListener("input", () => saveCurrentPassageAnswers());
    });
  }

  // Prev/Next buttons state
  const st = loadState();
  prevBtn.disabled = st.currentPassageIdx === 0;
  nextBtn.disabled = st.currentPassageIdx === (TEST.passages.length - 1);
}


    function renderAll() {
      renderTabs();
      renderPassage();
      renderQuestions();
    }

    // ============================================================
    // ANSWERS SAVE / RESTORE
    // ============================================================
    function ensurePassageSlot(passageId) {
      const a = loadAnswers();
      if (!a.passages[String(passageId)]) a.passages[String(passageId)] = { answers: {} };
      return a;
    }

function restorePassageAnswers(passageId) {
  const a = loadAnswers();
  const slot = a.passages[String(passageId)];
  const saved = slot && slot.answers ? slot.answers : {};

  Object.keys(saved).forEach(id => {
    const val = saved[id];

    // Text inputs (including readonly q23/q24 etc)
    const el = document.getElementById(id);
    if (el && el.tagName === "INPUT" && el.type === "text") {
      el.value = val;
      return;
    }
  });

  // Restore two-pick checkboxes using the filled answers q23/q24 and q25/q26
  function restoreTwoPick(groupName, q1, q2) {
    const v1 = (saved[`q${q1}`] || "").trim().toUpperCase();
    const v2 = (saved[`q${q2}`] || "").trim().toUpperCase();

    document.querySelectorAll(`input[name="${groupName}"]`).forEach(b => b.checked = false);

    [v1, v2].filter(Boolean).forEach(letter => {
      const box = document.querySelector(`input[name="${groupName}"][value="${letter}"]`);
      if (box) box.checked = true;
    });
  }

  if (passageId === 2) {
    restoreTwoPick("tp_23_24", 23, 24);
    restoreTwoPick("tp_25_26", 25, 26);
  }
}


function saveCurrentPassageAnswers() {
  const p = currentPassage();
  const a = ensurePassageSlot(p.id);
  const slot = a.passages[String(p.id)];

  const answers = {};

  // Save all question inputs by question number
  (p.questions || []).forEach(q => {
    const id = `q${q.number}`;
    const el = document.getElementById(id);
    if (el && el.tagName === "INPUT") {
      answers[id] = (el.value || "").trim();
    }
  });

  slot.answers = answers;
  slot.saved_at = new Date().toISOString();

  a.test_id = TEST.test_id || "IELTS_READING_T1";
  saveAnswers(a);
}


    // ============================================================
    // NAVIGATION
    // ============================================================
    prevBtn.addEventListener("click", () => {
      const st = loadState();
      if (st.currentPassageIdx === 0) return;
      saveCurrentPassageAnswers();
      st.currentPassageIdx -= 1;
      saveState(st);
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    nextBtn.addEventListener("click", () => {
      const st = loadState();
      if (st.currentPassageIdx >= TEST.passages.length - 1) return;
      saveCurrentPassageAnswers();
      st.currentPassageIdx += 1;
      saveState(st);
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // ============================================================
    // SUBMIT (same pattern you used elsewhere)
    // ============================================================
    submitBtn.addEventListener("click", submitReadingAndGoNext);

    async function submitReadingAndGoNext() {
      topMsg.textContent = "";
      qMsg.textContent = "";

      // Save current before submit
      saveCurrentPassageAnswers();

      const a = loadAnswers();
      a.completed = true;
      a.completed_at = new Date().toISOString();
      saveAnswers(a);

      const payload = {
        submission_id: submissionId,
        lead,
        answers: {
          reading: {
            test_id: a.test_id,
            passages: a.passages,
            completed: true
          }
        }
      };

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        if (!res.ok) {
          topMsg.textContent = "Submit failed: " + text;
          return;
        }
      } catch (e) {
        console.error(e);
        topMsg.textContent = "Network error submitting. Please try again.";
        return;
      }

      // Next step in your flow (change if your next page differs)
      window.location.assign("/listening.html");
    }

    // ============================================================
    // BOOT
    // ============================================================
    (async function boot() {
      const ok = await loadTest();
      if (!ok) return;

      testName.textContent = `— ${TEST.title || "Test 1"}`;

      // Ensure answers object exists and has test_id
      const a = loadAnswers();
      if (!a.test_id) { a.test_id = TEST.test_id || "IELTS_READING_T1"; saveAnswers(a); }

      // Start timer
      startTimerIfNeeded(TEST.time_minutes || DEFAULT_TIME_MIN);

      // Render
      renderAll();
    })();
  </script>
</body>
</html>
