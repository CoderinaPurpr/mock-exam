<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IELTS Mock Exam — Reading</title>
  <link rel="stylesheet" href="style.css" />

  <style>

/* ============================================================
   PASSAGE SECTION LETTER BLOCKS (A–G) — for Passage 2+
   ============================================================ */
.psec { display:flex; gap:12px; align-items:flex-start; margin: 10px 0 14px; }
.psec-badge{
  width: 28px; height: 28px; border-radius: 6px;
  border:1px solid rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; flex: 0 0 auto;
}
.psec-body p{ margin: 0 0 10px; line-height: 1.55; }
.psec-body p:last-child{ margin-bottom: 0; }

/* ============================================================
   QUESTION BLOCKS (match screenshot instructions)
   ============================================================ */
.qblock { margin: 14px 0; }
.qblock h3 { margin: 0 0 8px; font-size: 1.05em; }
.qnote { padding:10px 12px; border-radius:10px; background: rgba(0,0,0,.04); margin: 10px 0 12px; }

.match-row{
  display:grid;
  grid-template-columns: 64px 1fr;
  gap: 10px;
  align-items: start;
  padding: 8px 0;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.match-row:last-child{ border-bottom:0; }
.match-row input[type="text"]{
  width: 54px; padding: 6px 8px; text-transform: uppercase;
}

.summarybox{
  border:1px solid rgba(0,0,0,.12);
  border-radius: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,.02);
}
.summarybox p{ margin: 0 0 10px; line-height: 1.55; }
.summarybox p:last-child{ margin-bottom:0; }
.summarybox input[type="text"]{ max-width: 240px; }

.twopick{
  border:1px solid rgba(0,0,0,.12);
  border-radius: 12px;
  padding: 12px 14px;
  background: rgba(0,0,0,.02);
}
.twopick label{ display:block; margin: 6px 0; }
.twopick .ansrow{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 10px; }
.twopick .ansrow input[type="text"]{ width: 60px; padding: 6px 8px; text-transform: uppercase; }



    /* ============================================================
       SAFE HELPERS (won’t fight your style.css)
       ============================================================ */
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .spacer { height: 12px; }
    .hidden { display:none !important; }
    .notice { padding:10px 12px; border-radius:10px; background: rgba(0,0,0,.04); }
    .danger { color:#b00020; }
    .small { font-size: .9em; opacity: .85; }
    .q { margin: 10px 0; }
    .q input[type="text"] { max-width: 380px; }

    .reading-layout { display:grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
    @media (max-width: 950px){ .reading-layout { grid-template-columns: 1fr; } }

    .passage-box { border:1px solid #ddd; border-radius:10px; padding:12px; background:#fff; }
    .passage-text { white-space: pre-wrap; line-height:1.5; }

    .pill { border:1px solid #ddd; border-radius:999px; padding:6px 10px; background:#fff; }
    .pill.active { border-color:#111; font-weight:800; }

    .stickyBar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom:1px solid #eee; padding:10px 0; }
  </style>
</head>

<body>
  <main class="container">

    <!-- ============================================================
         STICKY TOP BAR
         ============================================================ -->
    <div class="stickyBar">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <strong>Reading</strong>
          <span class="small" id="testName">Loading…</span>
        </div>

        <div class="row">
          <div class="notice">
            Time left: <strong id="timeLeft">60:00</strong>
          </div>
          <button id="submitBtn" class="btn hidden" type="button">Finish Reading</button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="row" id="passageTabs"></div>
      <p id="topMsg" class="error" style="min-height:1.2em; margin:8px 0 0;"></p>
    </div>

    <div class="spacer"></div>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <div class="reading-layout">

      <!-- LEFT: PASSAGE -->
      <div class="card passage-box">
        <h2 id="passageTitle">Passage</h2>
        <div class="small" id="passageMeta"></div>
        <div class="spacer"></div>
        <div id="passageText" class="passage-text">Loading…</div>
      </div>

      <!-- RIGHT: QUESTIONS -->
      <div class="card">
        <h2 id="questionsTitle">Questions</h2>
        <div id="questions"></div>
        <p id="qMsg" class="error" style="min-height:1.2em;"></p>

        <div class="spacer"></div>
        <div class="row">
          <button id="prevBtn" class="btn secondary" type="button">Previous Passage</button>
          <button id="nextBtn" class="btn secondary" type="button">Next Passage</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ============================================================
    // GUARD: must start from landing page (index.html)
    // ============================================================
	(function guard() {
	  let lead = null;
	  try { lead = JSON.parse(localStorage.getItem("mock_lead") || "null"); } catch {}
	  const submissionId = localStorage.getItem("mock_submission_id");
	  if (!lead || !lead.name || !lead.email || !submissionId) {
		window.location.assign("/index.html");
	  }
	})();

	(function blockIfCompleted() {
	  const submissionId = localStorage.getItem("mock_submission_id");
	  if (!submissionId) return;

	  const answersKey = `mock_reading_answers_${submissionId}`;

	  try {
		const a = JSON.parse(localStorage.getItem(answersKey) || "null");
		if (a && a.completed) {
		  // If reading is done, force forward
		  window.location.assign("/listening.html");
		}
	  } catch {}
	})();



    // ============================================================
    // CONFIG (change only if you rename files)
    // ============================================================
    const TEST_JSON_PATH = "/reading/test-101.json"; // <-- your naming convention
    const DEFAULT_TIME_MIN = 60;

    // Storage keys (scoped per submission)
    const submissionId = localStorage.getItem("mock_submission_id");
    const lead = JSON.parse(localStorage.getItem("mock_lead") || "null");

    const KEY = {
      STATE: `reading_state_${submissionId}`,          // { currentPassageIdx, endTs }
      ANSWERS: `mock_reading_answers_${submissionId}`  // { test_id, passages:{1:{answers:{}},...}, completed }
    };

    // ============================================================
    // DOM
    // ============================================================
    const testName = document.getElementById("testName");
    const topMsg = document.getElementById("topMsg");
    const timeLeftEl = document.getElementById("timeLeft");

    const passageTabs = document.getElementById("passageTabs");
    const passageTitle = document.getElementById("passageTitle");
    const passageMeta = document.getElementById("passageMeta");
    const passageText = document.getElementById("passageText");

    const questionsTitle = document.getElementById("questionsTitle");
    const questionsEl = document.getElementById("questions");
    const qMsg = document.getElementById("qMsg");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");

    // ============================================================
    // STATE HELPERS
    // ============================================================
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(KEY.STATE) || "null"); } catch {}
      if (!s || typeof s !== "object") {
        s = {
          currentPassageIdx: 0, // 0-based index
          endTs: 0
        };
        saveState(s);
      }
      return s;
    }

    function saveState(s) {
      localStorage.setItem(KEY.STATE, JSON.stringify(s));
    }

    function loadAnswers() {
      let a = null;
      try { a = JSON.parse(localStorage.getItem(KEY.ANSWERS) || "null"); } catch {}
      if (!a || typeof a !== "object") {
        a = { test_id: "", passages: {}, completed: false };
        localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
      }
      return a;
    }

    function saveAnswers(a) {
      localStorage.setItem(KEY.ANSWERS, JSON.stringify(a));
    }

    function nowMs(){ return Date.now(); }

    // ============================================================
    // TIMER (simple 60-min reading timer)
    // ============================================================
    let timerTick = null;

    function startTimerIfNeeded(minutes) {
      const st = loadState();
      if (!st.endTs) {
        st.endTs = nowMs() + (minutes * 60 * 1000);
		localStorage.setItem(`reading_started_${submissionId}`, "1");
        saveState(st);
      }
      if (timerTick) clearInterval(timerTick);
      timerTick = setInterval(renderTimeLeft, 250);
      renderTimeLeft();
    }

    function renderTimeLeft() {
      const st = loadState();
      const remaining = Math.max(0, Math.floor((st.endTs - nowMs()) / 1000));
      const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
      const ss = String(remaining % 60).padStart(2, "0");
      timeLeftEl.textContent = `${mm}:${ss}`;
      if (remaining <= 60) timeLeftEl.classList.add("danger");
      else timeLeftEl.classList.remove("danger");
    }

    // ============================================================
    // LOAD TEST JSON
    // ============================================================
    let TEST = null; // loaded JSON

    async function loadTest() {
      topMsg.textContent = "";
      try {
        const res = await fetch(TEST_JSON_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error(await res.text());
        TEST = await res.json();
      } catch (e) {
        console.error(e);
        topMsg.textContent = "Could not load the reading test JSON. Check the file path and JSON syntax.";
        return false;
      }
      return true;
    }

    // ============================================================
    // RENDER UI
    // ============================================================
    function currentPassage() {
      const st = loadState();
      return TEST.passages[st.currentPassageIdx];
    }

    function renderTabs() {
      passageTabs.innerHTML = "";
      const st = loadState();

      TEST.passages.forEach((p, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (idx === st.currentPassageIdx ? " active" : "");
        b.textContent = `Passage ${p.id}`;
        b.addEventListener("click", () => {
          // Save current passage answers before switching
          saveCurrentPassageAnswers();
          st.currentPassageIdx = idx;
          saveState(st);
          renderAll();
        });
        passageTabs.appendChild(b);
      });
    }

function renderPassage() {
  const p = currentPassage();
  passageTitle.textContent = `Reading Passage ${p.id}: ${p.title}`;
  passageMeta.textContent = p.subtitle ? p.subtitle : "";

  // If passage has A–G sections, render nicely (fixes Passage 2 typography)
  if (Array.isArray(p.sections) && p.sections.length) {
    passageText.innerHTML = p.sections.map(sec => {
      const paras = (sec.paragraphs || []).map(t => `<p>${escapeHtml(t)}</p>`).join("");
      return `
        <div class="psec">
          <div class="psec-badge">${escapeHtml(sec.letter || "")}</div>
          <div class="psec-body">${paras}</div>
        </div>
      `;
    }).join("");
    return;
  }

  // Default: plain text
  passageText.textContent = p.text || "";
}

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderSummaryLine(p, qNum) {
  const q = p.questions.find(x => x.number === qNum);
  if (!q) return "";
  return `
    <p>
      ${escapeHtml(q.prompt)}
      <strong>${qNum}</strong>
      <input type="text" id="q${qNum}" placeholder="${escapeHtml(q.placeholder || "NO MORE THAN TWO WORDS")}">
      ${escapeHtml(q.after || "")}
    </p>
  `;
}

function renderTwoPickBlock(p, qA, qB, heading, noteHtml) {
  const q = p.questions.find(x => x.number === qA && x.type === "two_pick");
  if (!q) return "";

  const groupName = (qA === 23) ? "tp_23_24" : "tp_25_26";

  const opts = (q.options || []).map(([letter, text]) => {
    return `<label><input type="checkbox" name="${groupName}" value="${escapeHtml(letter)}"> <strong>${escapeHtml(letter)}</strong> ${escapeHtml(text)}</label>`;
  }).join("");

  return `
    <div class="qblock">
      <h3>${escapeHtml(heading)}</h3>
      <div class="qnote">${noteHtml}</div>

      <div class="twopick">
        <p style="font-weight:800; margin:0 0 10px;">${escapeHtml(q.prompt)}</p>
        ${opts}

        <div class="ansrow">
          <label><strong>${qA}</strong> <input type="text" id="q${qA}" placeholder="A–E" readonly></label>
          <label><strong>${qB}</strong> <input type="text" id="q${qB}" placeholder="A–E" readonly></label>
        </div>

        <div class="small" style="margin-top:6px;">Pick exactly 2 options (auto-fills ${qA} and ${qB}).</div>
      </div>
    </div>
  `;
}

function initTwoPickGroup(groupName, outId1, outId2) {
  const boxes = Array.from(document.querySelectorAll(`input[name="${groupName}"]`));
  const out1 = document.getElementById(outId1);
  const out2 = document.getElementById(outId2);
  if (!boxes.length || !out1 || !out2) return;

  function update(changedBox) {
    const checked = boxes.filter(b => b.checked).map(b => b.value);

    // Prevent selecting more than 2
    if (checked.length > 2 && changedBox) changedBox.checked = false;

    const picked = boxes.filter(b => b.checked).map(b => b.value);
    out1.value = picked[0] || "";
    out2.value = picked[1] || "";

    saveCurrentPassageAnswers();
  }

  boxes.forEach(b => b.addEventListener("change", () => update(b)));
}

  // --- Add these helpers near escapeHtml() ---

  function renderInlineBlank(num, before, after, placeholder) {
    return `
      <div class="q">
        <p style="margin:0; line-height:1.55;">
          <strong>${num}</strong>) ${escapeHtml(before)}
          <input type="text" id="q${num}" placeholder="${escapeHtml(placeholder || "one word")}">
          ${escapeHtml(after || "")}
        </p>
      </div>
    `;
  }

  function renderTfng(num, statement) {
    const name = `q${num}`;
    return `
      <div class="q">
        <p style="margin:0 0 8px; line-height:1.55;">
          <strong>${num}</strong>) ${escapeHtml(statement)}
        </p>

        <label style="display:block; margin:4px 0;">
          <input type="radio" name="${name}" value="TRUE"> TRUE
        </label>
        <label style="display:block; margin:4px 0;">
          <input type="radio" name="${name}" value="FALSE"> FALSE
        </label>
        <label style="display:block; margin:4px 0;">
          <input type="radio" name="${name}" value="NOT GIVEN"> NOT GIVEN
        </label>
      </div>
    `;
  }

  // --- Replace renderQuestions() with this version ---
// --- Replace renderQuestions() with this version (fixed control flow) ---
function renderQuestions() {
  qMsg.textContent = "";
  const p = currentPassage();

  questionsTitle.textContent = `Questions (Passage ${p.id})`;

  let html = "";

  // =========================
  // PASSAGE 1 — Full IELTS layout
  // =========================
  if (p.id === 1) {
    html = `
      <div class="qblock">
        <h3>Questions 1–4</h3>
        <div class="qnote">
          Complete the notes below.<br>
          Choose <strong>ONE WORD ONLY</strong> from the passage for each answer.<br>
          Write your answers in boxes 1–4 on your answer sheet.
        </div>

        ${renderInlineBlank(1, "The leaves of the tree are", "in shape", "one word")}
        ${renderInlineBlank(2, "The", "surrounds the fruit and breaks open when the fruit is ripe", "one word")}
        ${renderInlineBlank(3, "The", "is used to produce the spice nutmeg", "one word")}
        ${renderInlineBlank(4, "The covering known as the aril is used to produce", "", "one word")}
      </div>

      <hr>

      <div class="qblock">
        <h3>Questions 5–7</h3>
        <div class="qnote">
          Do the following statements agree with the information given in Reading Passage 1?<br><br>
          In boxes 5–7 on your answer sheet, write:<br><br>
          <strong>TRUE</strong> if the statement agrees with the information<br>
          <strong>FALSE</strong> if the statement contradicts the information<br>
          <strong>NOT GIVEN</strong> if there is no information on this
        </div>

        ${renderTfng(5, "In the Middle Ages, most Europeans knew where nutmeg was grown.")}
        ${renderTfng(6, "The VOC was the world's first major trading company.")}
        ${renderTfng(7, "Following the Treaty of Breda, the Dutch had control of all the islands where nutmeg grew.")}
      </div>

      <hr>

      <div class="qblock">
        <h3>Questions 8–13</h3>
        <div class="qnote">
          Complete the table below.<br>
          Choose <strong>ONE WORD ONLY</strong> from the passage for each answer.<br>
          Write your answers in boxes 8–13 on your answer sheet.
        </div>

        ${renderInlineBlank(8, "Nutmeg was brought to Europe by the", "", "one word")}
        ${renderInlineBlank(9, "Demand for nutmeg grew, as it was believed to be effective against the disease known as the", "", "one word")}
        ${renderInlineBlank(10, "The Dutch put", "on nutmeg to avoid it being cultivated outside the islands", "one word")}
        ${renderInlineBlank(11, "The Dutch finally obtained the island of", "from the British", "one word")}
        ${renderInlineBlank(12, "Nutmeg plants were secretly taken to", "", "one word")}
        ${renderInlineBlank(13, "Half the Banda Islands’ nutmeg plantations were destroyed by a", "", "one word")}
      </div>
    `;
  }

  // =========================
  // PASSAGE 2 — your existing custom layout
  // =========================
  else if (p.id === 2) {
    html = `
      <div class="qblock">
        <h3>Questions 14–18</h3>
        <div class="qnote">
          Reading Passage 2 has seven sections, <strong>A–G</strong>.<br>
          Which section contains the following information?<br><br>
          Write the correct letter, <strong>A–G</strong>, in boxes 14–18 on your answer sheet.
        </div>

        ${(p.questions || []).filter(q => q.type === "section_match").map(q => `
          <div class="match-row">
            <div><input type="text" id="q${q.number}" maxlength="1" placeholder="A–G"></div>
            <div><strong>${q.number}</strong> ${escapeHtml(q.prompt)}</div>
          </div>
        `).join("")}
      </div>

      <hr>

      <div class="qblock">
        <h3>Questions 19–22</h3>
        <div class="qnote">
          Complete the summary below.<br>
          Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.<br>
          Write your answers in boxes 19–22 on your answer sheet.
        </div>

        <div class="summarybox">
          <p style="font-weight:800; margin-bottom:10px;">The impact of driverless cars</p>
          ${renderSummaryLine(p, 19)}
          ${renderSummaryLine(p, 20)}
          <p style="margin-top:12px;"></p>
          ${renderSummaryLine(p, 21)}
          ${renderSummaryLine(p, 22)}
          <p style="margin-top:12px;">
            This would lead to a higher turnover of vehicles, and therefore no reduction in automotive manufacturing.
          </p>
        </div>
      </div>

      <hr>

      ${renderTwoPickBlock(
        p, 23, 24,
        "Questions 23 and 24",
        "Choose <strong>TWO</strong> letters, <strong>A–E</strong>.<br>Write the correct letters in boxes 23 and 24 on your answer sheet."
      )}

      <hr>

      ${renderTwoPickBlock(
        p, 25, 26,
        "Questions 25 and 26",
        "Choose <strong>TWO</strong> letters, <strong>A–E</strong>.<br>Write the correct letters in boxes 25 and 26 on your answer sheet."
      )}
    `;
  }

  // =========================
  // PASSAGE 3 — IELTS layout (Q27–40)
  // =========================
  else if (p.id === 3) {
    html = `
      <div class="q-block">
        <h3>Questions 27–32</h3>
        <div class="notice">
          Choose the correct letter, <strong>A, B, C</strong> or <strong>D</strong>.<br>
          Write the correct letter in boxes 27–32 on your answer sheet.
        </div>

        ${[
          { n:27, t:"The writer refers to visitors to New York to illustrate the point that",
            opts:[["A","exploration is an intrinsic element of being human."],["B","most people are enthusiastic about exploring."],["C","exploration can lead to surprising results."],["D","most people find exploration daunting."]] },
          { n:28, t:"According to the second paragraph, what is the writer’s view of explorers?",
            opts:[["A","Their discoveries have brought both benefits and disadvantages."],["B","Their main value is in teaching others."],["C","They act on an urge that is common to everyone."],["D","They tend to be more attracted to certain professions than to others."]] },
          { n:29, t:"The writer refers to a description of Egdon Heath to suggest that",
            opts:[["A","Hardy was writing about his own experience of exploration."],["B","Hardy was mistaken about the nature of exploration."],["C","Hardy’s aim was to investigate people’s emotional states."],["D","Hardy’s aim was to show the attraction of isolation."]] },
          { n:30, t:"In the fourth paragraph, the writer refers to ‘a golden age’ to suggest that",
            opts:[["A","the amount of useful information produced by exploration has decreased."],["B","fewer people are interested in exploring than in the 19th century."],["C","recent developments have made exploration less exciting."],["D","we are wrong to think that exploration is no longer necessary."]] },
          { n:31, t:"In the sixth paragraph, when discussing the definition of exploration, the writer argues that",
            opts:[["A","people tend to relate exploration to their own professional interests."],["B","certain people are likely to misunderstand the nature of exploration."],["C","the generally accepted definition has changed over time."],["D","historians and scientists have more valid definitions than the general public."]] },
          { n:32, t:"In the last paragraph, the writer explains that he is interested in",
            opts:[["A","how someone’s personality is reflected in their choice of places to visit."],["B","the human ability to cast new light on places that may be familiar."],["C","how travel writing has evolved to meet changing demands."],["D","the feelings that writers develop about the places that they explore."]] }
        ].map(q => `
          <div class="q">
            <p><strong>${q.n}</strong> ${q.t}</p>
            ${q.opts.map(o => `
              <label style="display:block; margin:4px 0;">
                <input type="radio" name="q${q.n}" value="${o[0]}">
                <strong>${o[0]}</strong> ${o[1]}
              </label>
            `).join("")}
          </div>
        `).join("")}
      </div>

      <hr>

      <div class="q-block">
        <h3>Questions 33–37</h3>
        <div class="notice">
          Look at the following statements (Questions 33–37) and the list of explorers below.<br>
          Match each statement with the correct explorer, <strong>A–E</strong>.<br>
          Write the correct letter, A–E, in boxes 33–37 on your answer sheet.<br>
          <strong>NB</strong> You may use any letter more than once.
        </div>

        <div class="notice" style="margin-top:10px;">
          <strong>List of Explorers</strong><br>
          <strong>A</strong> Peter Fleming<br>
          <strong>B</strong> Ran Fiennes<br>
          <strong>C</strong> Chris Bonington<br>
          <strong>D</strong> Robin Hanbury-Tenison<br>
          <strong>E</strong> Wilfred Thesiger
        </div>

        ${[
          [33,"He referred to the relevance of the form of transport used."],
          [34,"He described feelings on coming back home after a long journey."],
          [35,"He worked for the benefit of specific groups of people."],
          [36,"He did not consider learning about oneself an essential part of exploration."],
          [37,"He defined exploration as being both unique and of value to others."]
        ].map(row => `
          <div class="q">
            <label>
              <strong>${row[0]}</strong> ${row[1]}<br>
              <input type="text" id="q${row[0]}" placeholder="A–E" style="max-width:110px; text-transform:uppercase;">
            </label>
          </div>
        `).join("")}
      </div>

      <hr>

      <div class="q-block">
        <h3>Questions 38–40</h3>
        <div class="notice">
          Complete the summary below.<br>
          Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.<br>
          Write your answers in boxes 38–40 on your answer sheet.
        </div>

        <div class="q" style="margin-top:10px;">
          <div class="notice" style="text-align:center; font-weight:800;">The writer’s own bias</div>

          <p style="margin-top:10px; line-height:1.6;">

  // --- Replace restorePassageAnswers() with this version ---
function restorePassageAnswers(passageId) {
  const a = loadAnswers();
  const slot = a.passages[String(passageId)];
  const saved = slot && slot.answers ? slot.answers : {};

  Object.keys(saved).forEach(id => {
    const val = saved[id];

    // Text inputs
    const el = document.getElementById(id);
    if (el && el.tagName === "INPUT" && el.type === "text") {
      el.value = val;
      return;
    }

    // Radios (q27 etc)
    const target = document.querySelector(`input[name="${id}"][value="${String(val).toUpperCase()}"]`);
    if (target) target.checked = true;
  });
}

function saveCurrentPassageAnswers() {
  const p = currentPassage();
  const a = ensurePassageSlot(p.id);
  const slot = a.passages[String(p.id)];

  const answers = {};

  // Save all visible inputs in the questions panel (works for P3 + your other layouts)
  questionsEl.querySelectorAll("input").forEach(input => {
    if (!input.id && !input.name) return;

    // text
    if (input.type === "text" && input.id) {
      answers[input.id] = (input.value || "").trim();
      return;
    }

    // radio
    if (input.type === "radio" && input.name) {
      if (input.checked) answers[input.name] = String(input.value || "").trim().toUpperCase();
      return;
    }
  });

  slot.answers = answers;
  slot.saved_at = new Date().toISOString();

  a.test_id = TEST.test_id || "IELTS_READING_T1";
  saveAnswers(a);
}








    function renderAll() {
      renderTabs();
      renderPassage();
      renderQuestions();

    // ============================================================
    // ANSWERS SAVE / RESTORE
    // ============================================================
    function ensurePassageSlot(passageId) {
      const a = loadAnswers();
      if (!a.passages[String(passageId)]) a.passages[String(passageId)] = { answers: {} };
      return a;
    }




    // ============================================================
    // NAVIGATION
    // ============================================================
    prevBtn.addEventListener("click", () => {
      const st = loadState();
      if (st.currentPassageIdx === 0) return;
      saveCurrentPassageAnswers();
      st.currentPassageIdx -= 1;
      saveState(st);
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    nextBtn.addEventListener("click", async () => {
     const st = loadState();
     const isLast = st.currentPassageIdx >= TEST.passages.length - 1;

    // Always save before moving on
    saveCurrentPassageAnswers();

    if (isLast) {
      // On last passage, behave like Finish Reading
      await submitReadingAndGoNext(); // will include confirm in step 3
      return;
    }

    st.currentPassageIdx += 1;
    saveState(st);
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });


    // ============================================================
    // SUBMIT (same pattern you used elsewhere)
    // ============================================================
    submitBtn.addEventListener("click", () => {
     saveCurrentPassageAnswers();
     window.location.href = "/listening.html";
    });


    async function submitReadingAndGoNext() {
      topMsg.textContent = "";
      qMsg.textContent = "";
	  
	  if (!confirm("Finish Reading and proceed to Listening? You won’t be able to return to Reading.")) {
        return;
      }


      // Save current before submit
      saveCurrentPassageAnswers();

      const a = loadAnswers();
      a.completed = true;
      a.completed_at = new Date().toISOString();
      saveAnswers(a);

      const payload = {
        submission_id: submissionId,
        lead,
        answers: {
          reading: {
            test_id: a.test_id,
            passages: a.passages,
            completed: true
          }
        }
      };

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        if (!res.ok) {
          topMsg.textContent = "Submit failed: " + text;
          return;
        }
      } catch (e) {
        console.error(e);
        topMsg.textContent = "Network error submitting. Please try again.";
        return;
      }

      // Next step in your flow (change if your next page differs)
      window.location.assign("/listening.html");
    }

    // ============================================================
    // BOOT
    // ============================================================
    (async function boot() {
      const ok = await loadTest();
      if (!ok) return;

      testName.textContent = `— ${TEST.title || "Test 1"}`;

      // Ensure answers object exists and has test_id
      const a = loadAnswers();
      if (!a.test_id) { a.test_id = TEST.test_id || "IELTS_READING_T1"; saveAnswers(a); }

      // Start timer
      startTimerIfNeeded(TEST.time_minutes || DEFAULT_TIME_MIN);

      // Render
      renderAll();
    })();
